name: PR Label Automation (CI)

# Handles label transitions when CI completes (pass or fail).
# Split from pr-labels.yml because workflow_run fires on every CI
# completion (including merges to main), which caused noisy failures
# when there was no associated PR.
#
# NOTE: References the CI workflow by name ("CI").
# If the CI workflow in ci.yml is ever renamed, update the name here too.
#
# LIMITATION: workflow_run triggers always run from the default branch
# (main), not the PR branch. Changes to this file cannot be tested
# on a PR — they take effect only after merge.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  pull-requests: write
  checks: read

jobs:
  # When CI passes on a PR branch, promote from Awaiting CI OR CI Failed
  # to Ready for QA. Skips if Dev Active is present (dev isn't done yet)
  # or if a review-state label (QA Active / Ready for QA Signoff /
  # QA Approved) is present — review-machine state is not torn down by
  # a CI re-run.
  on-ci-pass:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_branch != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Promote to Ready for QA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # Look up the associated PR.
          # The API can 404 after a force-push (orphaned run).
          # Capture output only on success so 404 body doesn't leak into $PR.
          PR=""
          API_OUT=$(gh api "repos/$REPO/actions/runs/$RUN_ID/pull_requests" \
            --jq '.[0].number // empty' 2>&1) && PR="$API_OUT" || true

          # Fallback: pull_requests array is empty for dependabot PRs.
          # Search by head branch instead. HEAD_BRANCH comes via env
          # (not a direct GHA expression) because fork PR branch names
          # are contributor-controlled and allow shell metacharacters.
          if [ -z "$PR" ]; then
            PR=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open \
              --json number --jq '.[0].number // empty' 2>/dev/null) || true
          fi

          if [ -z "$PR" ]; then
            echo "No PR associated with this workflow run — exiting"
            exit 0
          fi

          LABELS=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')

          # Dev Active means dev isn't done — don't promote.
          # on-unlabel will handle promotion when Dev Active is removed.
          if echo "$LABELS" | grep -q "^Dev Active$"; then
            echo "Dev Active present — skipping promotion"
            exit 0
          fi

          # Don't disrupt in-flight review state. QA Active implies the
          # PR has already advanced past Ready for QA; Ready for QA
          # Signoff and QA Approved are even further along. A passing
          # CI re-run on those states is a no-op — the success status
          # is visible on its own check, no label transition needed.
          for QA_STATE in "QA Active" "Ready for QA Signoff" "QA Approved"; do
            if echo "$LABELS" | grep -q "^$QA_STATE$"; then
              echo "$QA_STATE present — skipping promotion (review in progress)"
              exit 0
            fi
          done

          # Promote if Awaiting CI OR CI Failed is the current pre-state.
          # Closes #378: previous code only fired on Awaiting CI, so a
          # PR sitting at CI Failed never auto-promoted when a fix push
          # made CI go green.
          REMOVE=""
          if echo "$LABELS" | grep -q "^Awaiting CI$"; then
            REMOVE="Awaiting CI"
          fi
          if echo "$LABELS" | grep -q "^CI Failed$"; then
            REMOVE="${REMOVE:+$REMOVE,}CI Failed"
          fi
          if [ -n "$REMOVE" ]; then
            gh pr edit "$PR" --repo "$REPO" --remove-label "$REMOVE"
            gh pr edit "$PR" --repo "$REPO" --add-label "Ready for QA"
          fi

  # When CI fails on a PR branch, set CI Failed.
  # Skips if Dev Active is present (dev is already working) or if a
  # review-state label (QA Active / Ready for QA Signoff / QA Approved)
  # is present — a CI re-run failure does not retroactively invalidate
  # an in-flight review; the failed check is visible on its own.
  on-ci-fail:
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_branch != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Set CI Failed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          PR=""
          API_OUT=$(gh api "repos/$REPO/actions/runs/$RUN_ID/pull_requests" \
            --jq '.[0].number // empty' 2>&1) && PR="$API_OUT" || true

          # HEAD_BRANCH comes via env (not a direct GHA expression)
          # because fork PR branch names are contributor-controlled.
          if [ -z "$PR" ]; then
            PR=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open \
              --json number --jq '.[0].number // empty' 2>/dev/null) || true
          fi

          if [ -z "$PR" ]; then
            echo "No PR associated with this workflow run — exiting"
            exit 0
          fi

          LABELS=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')

          # Dev Active means dev is already working — don't add CI Failed
          if echo "$LABELS" | grep -q "^Dev Active$"; then
            echo "Dev Active present — skipping CI Failed"
            exit 0
          fi

          # Don't disrupt in-flight review state. The failure is visible
          # via the CI status check on the PR; tearing down review-machine
          # state on a (possibly transient) re-run failure would erase
          # work the reviewer has already done.
          for QA_STATE in "QA Active" "Ready for QA Signoff" "QA Approved"; do
            if echo "$LABELS" | grep -q "^$QA_STATE$"; then
              echo "$QA_STATE present — skipping CI Failed (review in progress)"
              exit 0
            fi
          done

          # Set CI Failed if state is Awaiting CI OR Ready for QA.
          # Adding Ready for QA closes the symmetric trap noted in #378:
          # a CI re-run failure on a PR sitting at Ready for QA used to
          # leave the PR labelled green even though CI was now red.
          REMOVE=""
          if echo "$LABELS" | grep -q "^Awaiting CI$"; then
            REMOVE="Awaiting CI"
          fi
          if echo "$LABELS" | grep -q "^Ready for QA$"; then
            REMOVE="${REMOVE:+$REMOVE,}Ready for QA"
          fi
          if [ -n "$REMOVE" ]; then
            gh pr edit "$PR" --repo "$REPO" --remove-label "$REMOVE"
            gh pr edit "$PR" --repo "$REPO" --add-label "CI Failed"
          fi

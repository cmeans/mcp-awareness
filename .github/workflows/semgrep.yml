name: semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    # The semgrep container ships the CLI + required runtime; no extra
    # install step needed. Using a pinned tag rather than :latest so a
    # new semgrep release can't change the policy without a PR.
    container:
      image: semgrep/semgrep:1.161.0
    steps:
      - uses: actions/checkout@v6

      # Three sources merged in one run:
      #   - p/python       — Semgrep's community Python rule pack
      #   - p/owasp-top-ten — OWASP top-ten coverage
      #   - .semgrep/      — project-specific custom rules (SQL owner scope,
      #                      credential-identifier log prevention, SQL-string
      #                      interpolation guard). See docs/security/semgrep-rules.md.
      #
      # --error makes any finding exit non-zero (fails CI). --oss-only
      # disables Semgrep-Pro features we don't pay for. --skip-unknown-
      # extensions keeps the scan from warning about SVG / favicon files
      # which semgrep doesn't understand.
      - name: Run Semgrep
        run: |
          semgrep \
            --config p/python \
            --config p/owasp-top-ten \
            --config .semgrep/ \
            --error \
            --oss-only \
            --skip-unknown-extensions \
            --metrics=off
